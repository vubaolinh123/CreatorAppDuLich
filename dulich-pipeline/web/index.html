<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đà Lạt Studio — Tạo video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F3EDE1; --bg2:#E9DECB; --surface:#FFFDF8; --surface2:#F6F0E4;
    --ink:#23271F; --muted:#7a7d6e; --line:#E7DDCA;
    --pine:#1F4B38; --pine2:#2C6A4E; --amber:#CF7E36; --amber2:#E0964B; --rose:#D6849C;
    --ok:#2E8B57; --err:#BE4A45; --radius:16px;
    --shadow:0 12px 38px rgba(40,52,38,.12); --shadow-sm:0 3px 12px rgba(40,52,38,.07);
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.55; font-family: var(--sans);
    background:
      radial-gradient(1100px 620px at 88% -8%, rgba(207,126,54,.16), transparent 60%),
      radial-gradient(900px 560px at 6% 4%, rgba(31,75,56,.14), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-attachment: fixed; min-height: 100vh; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(207,126,54,.28); }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 11px; font-weight: 600; transition: transform .12s ease, filter .15s ease, background .15s ease, box-shadow .15s ease; }
  button:active { transform: translateY(1px); }
  .btn { background: var(--pine); color: #FBF7EE; padding: 11px 18px; font-size: 14px; box-shadow: 0 6px 16px rgba(31,75,56,.22); }
  .btn:hover { background: var(--pine2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  .btn-pink { background: linear-gradient(135deg, var(--amber2), var(--amber)); color: #fff; box-shadow: 0 6px 16px rgba(207,126,54,.28); }
  .btn-ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink); box-shadow: var(--shadow-sm); }
  .btn-ghost:hover { border-color: var(--pine2); color: var(--pine); }
  input, textarea, select { width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    border-radius: 11px; padding: 10px 13px; font-size: 14px; font-family: inherit; resize: vertical; transition: border-color .15s, box-shadow .15s; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--pine2); box-shadow: 0 0 0 3px rgba(44,106,78,.14); }
  label { display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 12px 0 5px; font-weight: 700; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); animation: rise .45s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .muted { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }

  /* LOGIN */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #login .card { width: 100%; max-width: 390px; text-align: center; padding: 34px 30px; }
  #login .logo { font-size: 34px; }
  #login h1 { font-family: var(--serif); font-weight: 600; font-size: 30px; margin: 8px 0 2px; color: var(--pine); letter-spacing: -.01em; }
  #login .err { color: var(--err); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* HEADER */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 24px;
    background: rgba(252,248,240,.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20; }
  header .brand { font-family: var(--serif); font-weight: 600; font-size: 21px; color: var(--pine); letter-spacing: -.01em; }
  header .brand small { display: block; font-family: var(--sans); font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: 0; }
  .hdr-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .chip-hook { background: rgba(31,75,56,.10); color: var(--pine); }
  .chip-role { background: rgba(207,126,54,.15); color: #a85f24; }
  button.chip { box-shadow: none; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 26px 22px 60px; }
  .grid5050 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
  @media (max-width: 900px) { .grid5050 { grid-template-columns: 1fr; } }
  h2.sec { font-family: var(--serif); font-weight: 600; font-size: 20px; letter-spacing: -.01em; color: var(--pine); margin: 0 0 14px; }

  .scene { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; background: var(--surface2); transition: box-shadow .15s, border-color .15s; }
  .scene:hover { box-shadow: var(--shadow-sm); }
  .scene .tag { font-size: 11px; color: var(--pine); font-weight: 800; letter-spacing: .03em; }
  .scene .tag .dur { color: var(--muted); font-weight: 600; }
  .scene-total { font-size: 12px; margin-top: 8px; font-weight: 700; }
  .refsrc { font-size: 13px; margin: 9px 0 2px; padding: 8px 11px; background: rgba(47,107,79,.08);
    border-left: 3px solid var(--pine2); border-radius: 7px; color: var(--ink); line-height: 1.4; }
  .scene-total.ok { color: var(--ok); } .scene-total.low { color: var(--amber); }
  .clip-list { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .clip-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 9px; padding: 5px 8px; font-size: 12px; }
  .clip-row img { width: 30px; height: 53px; object-fit: cover; border-radius: 5px; background: #eee; }
  .clip-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip-row .du { color: var(--ok); font-weight: 700; } .clip-row .x { background: none; color: var(--err); font-size: 15px; box-shadow: none; }
  .drop { border: 1.5px dashed var(--line); border-radius: 11px; padding: 13px; text-align: center; color: var(--muted);
    font-size: 12px; cursor: pointer; margin-top: 8px; background: var(--surface); transition: .15s; }
  .drop:hover { border-color: var(--amber); color: var(--amber); }
  .drop.over { border-color: var(--pine2); background: rgba(31,75,56,.06); color: var(--pine); }
  .pager { display: flex; align-items: center; gap: 8px; }
  .pager button { padding: 4px 10px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
  .pager .idx { font-size: 12px; color: var(--muted); font-weight: 600; }

  /* preview phones */
  .preview-hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .phones { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .phone { width: min(31%, 230px); aspect-ratio: 9/16; border-radius: 18px; border: 1px solid var(--line);
    position: relative; overflow: hidden; background: #e9e6dd center/cover no-repeat; flex: 0 0 auto; box-shadow: var(--shadow); }
  .phone .plabel { position: absolute; top: 7px; left: 0; right: 0; text-align: center; font-size: 9px; font-weight: 700;
    color: #fff; z-index: 4; text-shadow: 0 1px 3px rgba(0,0,0,.7); letter-spacing: .03em; }
  .phone .hookov { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 3; }
  .phone .pcap { position: absolute; bottom: 5%; left: 0; right: 0; z-index: 4; text-align: center; color: #fff;
    font-size: clamp(8px,1.5vw,12px); font-weight: 700; padding: 0 8px; line-height: 1.2;
    text-shadow: 0 0 3px #000,1px 1px 2px #000; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .phone .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #b3ae9f; font-size: 10px; }
  .phone .pbadge { position: absolute; top: 13%; left: 8px; z-index: 4; color: #fff; font-size: clamp(8px,1.4vw,11px);
    font-weight: 700; font-style: italic; text-shadow: 0 0 3px #000,1px 1px 2px #000; }
  .phone .pbadge b { font-style: normal; background: var(--amber); padding: 1px 6px; border-radius: 6px; margin-left: 3px; }
  .phone .pbadge .paddr { font-style: normal; font-weight: 600; font-size: clamp(6px,1.1vw,9px); margin-top: 2px; }

  /* scene nav arrows (đối xứng, đẹp) */
  .navarrow { position: fixed; top: 50%; transform: translateY(-50%); z-index: 50; width: 52px; height: 84px;
    display: none; align-items: center; justify-content: center; border-radius: 16px; cursor: pointer;
    background: rgba(31,75,56,.86); color: #FBF7EE; font-size: 26px; line-height: 1; backdrop-filter: blur(4px);
    box-shadow: var(--shadow); transition: background .15s, transform .12s; }
  .navarrow:hover { background: var(--pine2); }
  .navarrow.l { left: 14px; } .navarrow.r { right: 14px; }

  /* news color pick */
  .colors { display: flex; gap: 8px; margin-top: 6px; }
  .colordot { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; box-shadow: var(--shadow-sm); transition: transform .12s; }
  .colordot:hover { transform: scale(1.08); }
  .colordot.active { border-color: var(--ink); }
  .srclist a { display: block; color: var(--pine); font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); text-decoration: none; word-break: break-all; font-weight: 500; }

  /* library + viewer + overlays */
  .lib { position: fixed; inset: 0; background: rgba(26,38,30,.62); backdrop-filter: blur(10px); z-index: 60; overflow-y: auto; padding: 34px 24px; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .lib-inner { max-width: 1140px; margin: 0 auto; }
  .lib-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; color: #FBF7EE; }
  .lib-top h2 { font-family: var(--serif); font-weight: 600; font-size: 26px; margin: 0; }
  .lib-top .btn-ghost { background: rgba(255,253,248,.14); border-color: rgba(255,253,248,.3); color: #FBF7EE; backdrop-filter: blur(4px); }
  .lib-top .btn-ghost:hover { background: rgba(255,253,248,.24); color: #fff; }
  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 18px; }
  .lib-card { border-radius: 16px; overflow: hidden; background: var(--surface); box-shadow: 0 14px 34px rgba(0,0,0,.28); transition: transform .18s ease; }
  .lib-card:hover { transform: translateY(-4px); }
  .lib-card video { width: 100%; display: block; background: #11140f; aspect-ratio: 9/16; object-fit: cover; }
  .lib-card .cap { padding: 10px 12px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .lib-card .cap span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .lib-card .expand { background: var(--pine); color: #FBF7EE; border: none; border-radius: 9px; padding: 5px 11px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .lib-card .expand:hover { background: var(--pine2); }
  .lib-render { position: relative; aspect-ratio: 9/16; background: #161a13 center/cover; }
  .lib-render .blur { position: absolute; inset: 0; background: inherit; filter: blur(8px) brightness(.5); }
  .lib-render .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 2; color: #fff; font-size: 13px; font-weight: 600; }
  .spin { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,.22); border-top-color: var(--amber2); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lib-bar { position: absolute; bottom: 0; left: 0; height: 6px; background: linear-gradient(90deg, var(--amber2), var(--amber)); z-index: 3; transition: width .4s ease; }
  .viewer { position: fixed; inset: 0; background: rgba(14,18,14,.94); backdrop-filter: blur(6px); z-index: 80; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; animation: fadein .2s ease; }
  .viewer video { height: 88vh; max-width: 96vw; aspect-ratio: 9/16; border-radius: 16px; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .viewer .close { position: absolute; top: 18px; right: 22px; color: #fff; font-size: 22px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.14); backdrop-filter: blur(4px); }
  .viewer .close:hover { background: rgba(255,255,255,.26); }
  .created { position: fixed; inset: 0; background: rgba(20,30,25,.5); backdrop-filter: blur(5px); z-index: 90; display: flex; align-items: center; justify-content: center; }
  .created .box { background: var(--surface); border-radius: 20px; padding: 32px 44px; text-align: center; box-shadow: 0 24px 70px rgba(0,0,0,.3); animation: rise .4s ease both; }
  .created .ok { font-size: 48px; }
  .stat-table { width: 100%; border-collapse: collapse; }
  .stat-table th, .stat-table td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .stat-table th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .stat-table .num { font-weight: 800; color: var(--pine); font-family: var(--serif); }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #FBF7EE; border: none;
    padding: 11px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 100; box-shadow: 0 12px 34px rgba(0,0,0,.3); }
  /* image album generator */
  .alb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 16px; }
  .alb-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 20px rgba(120,110,160,.08); }
  .alb-card .nm { font-weight: 700; font-size: 14px; }
  .alb-card .id { font-size: 11px; color: var(--muted); }
  .alb-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
  .alb-slide { flex: 0 0 auto; }
  .alb-slide img { height: 360px; width: auto; max-width: 60vw; border-radius: 10px; cursor: zoom-in; background: var(--surface2); display: block; }
  .alb-slide a { display: block; font-size: 11px; text-align: center; margin-top: 5px; color: var(--muted); text-decoration: none; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; margin-top: 8px; }
  .gal-card { border-radius: 10px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
  .gal-card img { width: 100%; display: block; aspect-ratio: 4/5; object-fit: cover; cursor: zoom-in; background: #eee; }
  .gal-card .row { display: flex; gap: 6px; padding: 6px; }
  .gal-card .row a { flex: 1; text-align: center; font-size: 11px; padding: 4px 6px;
    border-radius: 7px; border: 1px solid var(--line); background: var(--card2); color: var(--ink); text-decoration: none; }
  .imgview { position: fixed; inset: 0; background: rgba(15,15,25,.92); z-index: 85; display: flex; align-items: center; justify-content: center; }
  .imgview img { max-height: 92vh; max-width: 96vw; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .imgview .close { position: absolute; top: 18px; right: 22px; color: #fff; font-size: 26px; background: none; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <div class="logo">🌲🌸</div>
    <h1>Đà Lạt Studio</h1>
    <div class="muted">Đăng nhập để tạo video</div>
    <label style="text-align:left">Tài khoản</label>
    <input id="lg-user" placeholder="vd: nv1 / admin / tintuc" autocomplete="username">
    <label style="text-align:left">Mật khẩu</label>
    <input id="lg-pass" type="password" placeholder="••••" autocomplete="current-password">
    <button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Đăng nhập</button>
    <div class="err" id="lg-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="brand">🌲🌸 Đà Lạt Studio<small id="hd-sub"></small></div>
    <div class="hdr-right" id="hd-right"></div>
  </header>
  <div class="wrap" id="appbody"></div>
</div>

<!-- overlays -->
<div class="viewer hidden" id="viewer"><button class="close" onclick="closeViewer()">✕</button><video id="viewerVid" controls></video></div>
<div class="imgview hidden" id="imgview" onclick="closeImg()"><button class="close" onclick="closeImg()">✕</button><img id="imgviewImg"></div>
<div class="created hidden" id="created"><div class="box"><div class="ok">✅</div><div style="font-weight:700;font-size:18px;margin-top:6px">Đã tạo video!</div><div class="muted">Đang render ở nền — bạn cứ tạo clip mới.</div></div></div>

<script>
const API = location.origin;
let SESSION = null;
const HOOK_NAMES = { hook_red:"Viền đỏ", hook_green:"Hộp xanh", hook_brown:"Hộp nâu", hook_serif:"Khung vuông", hook_meo:"Khung mèo", hook_news:"Tin tức" };
const PAGE = 3;
let currentScenes = [], scenePage = 0, jobs = [], rendering = false, prevTimer = null, hookOverlayUrl = "";
let LR_ENGINE = "pil", LR_STYLE = "", LR_BADGE = "full", LR_TRANSITION = "none";
let newsColor = "pink";

function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}

// ---------- LOGIN ----------
async function doLogin(){
  const u=document.getElementById("lg-user").value.trim(), p=document.getElementById("lg-pass").value;
  const err=document.getElementById("lg-err"); err.textContent="";
  try{
    const r=await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    const j=await r.json();
    if(!j.ok){err.textContent=j.error||"Sai tài khoản";return;}
    SESSION=j; sessionStorage.setItem("dalat_session",JSON.stringify(j)); startApp();
  }catch(e){err.textContent="Lỗi kết nối server";}
}
function logout(){ sessionStorage.removeItem("dalat_session"); history.replaceState(null,"",location.pathname); location.reload(); }

// Auto-login theo hash: domain/#nv1 → luồng nv1, domain/#tintuc → luồng tin tức (per-tab session)
const HASH_USERS = {tintuc:"tintuc",nv1:"nv1",nv2:"nv2",nv3:"nv3",nv4:"nv4",nv5:"nv5",admin:"admin"};
async function autoLoginFromHash(){
  const h=(location.hash||"").replace(/^#/,"").trim().toLowerCase();
  const u=HASH_USERS[h]; if(!u)return false;
  const p = u==="admin" ? "admin123" : "123";
  try{
    const r=await fetch(API+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    const j=await r.json(); if(!j.ok)return false;
    SESSION=j; sessionStorage.setItem("dalat_session",JSON.stringify(j)); startApp(); return true;
  }catch(e){return false;}
}
document.getElementById("lg-pass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});

function startApp(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("hd-sub").textContent = SESSION.name + (SESSION.role==="staff"?" · Hook: "+(HOOK_NAMES[SESSION.hook_style]||SESSION.hook_style):"");
  const right=document.getElementById("hd-right");
  let html = `<span class="chip chip-role">${SESSION.role==="admin"?"Quản lý":SESSION.role==="news"?"Tin tức":"Nhân viên"}</span>`;
  html += `<button class="btn-ghost chip" onclick="renderHome()">🏠 Trang chủ</button>`;
  html += `<button class="btn-ghost chip" onclick="renderVideoPage()">📹 Video</button>`;
  if(SESSION.role==="staff"||SESSION.role==="news") html += `<button class="btn-ghost chip" onclick="renderPromptEditor()">📝 Prompt</button>`;
  html += `<button class="btn-ghost chip" onclick="renderLibraryHub('venues')">📚 Thư viện</button>`;
  html += `<button class="btn-ghost chip" onclick="renderImageGen()">🎨 Ảnh</button>`;
  if(SESSION.role==="admin") html += `<button class="btn-ghost chip" onclick="renderSettings()">⚙️ Cài đặt</button>`;
  html += `<button class="btn-ghost chip" onclick="logout()">Đăng xuất</button>`;
  right.innerHTML=html;
  renderHome();
}

// Dispatch theo vai trò (cũng dùng làm nút "Quay lại" từ placeholder Ảnh)
function renderHome(){
  if(SESSION.role==="admin") renderAdmin();
  else if(SESSION.role==="news") renderNews();
  else renderStaff();
}

// Placeholder phần ẢNH — sẽ ráp module tạo ảnh vào đây sau (route /assemble-image đã chừa sẵn).
function renderImageSoon(){
  resetEditor && resetEditor();
  document.getElementById("appbody").innerHTML = `
    <div class="card" style="max-width:560px;margin:40px auto;text-align:center">
      <div style="font-size:54px;margin-bottom:8px">🖼</div>
      <h2 class="sec" style="justify-content:center">Tạo Ảnh — sắp ra mắt</h2>
      <div class="muted" style="margin:10px 0 18px">Tính năng tạo ảnh (album/post) đang được phát triển và sẽ gắn vào ngay trong app này.</div>
      <button class="btn-ghost" onclick="renderHome()">← Quay lại tạo video</button>
    </div>`;
}

// ---------- CÀI ĐẶT API KEY (admin) — lưu vào .env ----------
async function renderSettings(){
  if(typeof resetEditor==="function") resetEditor();
  document.getElementById("appbody").innerHTML = `
    <div class="card" style="max-width:680px;margin:22px auto">
      <h2 class="sec">⚙️ Cài đặt API key</h2>
      <div class="muted" style="margin-bottom:14px">App chạy <b>FREE</b> không cần key. Chỉ điền nếu muốn bật tính năng trả phí. Key lưu ngay trên máy này (file <code>.env</code>), không gửi đi đâu, có hiệu lực ngay.</div>
      <div id="setbox" class="muted">Đang tải…</div>
    </div>`;
  try{
    const r=await fetch(API+"/settings",{cache:"no-store"}); const j=await r.json();
    const groups={}; (j.keys||[]).forEach(k=>{(groups[k.group]=groups[k.group]||[]).push(k);});
    let html="";
    for(const g in groups){
      html+=`<div style="margin:16px 0 8px;font-weight:800;color:var(--pine)">${g}</div>`;
      groups[g].forEach(k=>{
        const badge=k.is_set?`<span class="chip chip-hook">đã có</span>`:`<span class="chip" style="background:#eee;color:#999">chưa có</span>`;
        const link=k.link?`<a href="${k.link}" target="_blank" style="font-size:12px">lấy key ↗</a>`:"";
        html+=`<div style="margin-bottom:13px">
          <label style="display:flex;justify-content:space-between;align-items:center;margin:0 0 4px">
            <span>${k.label} ${badge}</span>${link}</label>
          <input data-key="${k.key}" type="password" autocomplete="off" placeholder="${k.is_set?'•••••• (để trống = giữ nguyên)':'dán key vào đây'}">
          <div class="muted" style="font-size:12px;margin-top:3px">${k.desc}</div>
        </div>`;
      });
    }
    html+=`<div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn" style="flex:1" onclick="saveSettings()">💾 Lưu</button>
      <button class="btn-ghost" onclick="renderHome()">← Quay lại</button></div>`;
    document.getElementById("setbox").innerHTML=html;
  }catch(e){ document.getElementById("setbox").textContent="Lỗi tải cài đặt: "+e.message; }
}
async function saveSettings(){
  const payload={};
  document.querySelectorAll("#setbox input[data-key]").forEach(i=>{ const v=i.value.trim(); if(v) payload[i.getAttribute("data-key")]=v; });
  if(!Object.keys(payload).length){ toast("Chưa nhập key mới nào"); return; }
  try{
    const r=await fetch(API+"/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const j=await r.json();
    if(j.success){ toast(j.message||"Đã lưu"); renderSettings(); } else toast(j.error||"Lưu lỗi");
  }catch(e){ toast("Lỗi: "+e.message); }
}

function _collectVenue(id){const o={};if(id)o.id=id;document.querySelectorAll("#vform [data-f]").forEach(el=>o[el.getAttribute("data-f")]=el.value.trim());return o;}
async function saveVenue(id){
  const v=_collectVenue(id);
  if(!v.name){toast("Chưa có tên quán");return;}
  try{
    const r=await fetch(API+"/venues",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
    const j=await r.json();
    if(j.success){ toast("Đã lưu"); (j.venue?venueForm(j.venue):renderVenues()); } else toast(j.error||"Lưu lỗi");
  }catch(e){ toast("Lỗi: "+e.message); }
}
async function deleteVenue(id,name){
  if(!confirm("Xóa '"+name+"' khỏi thư viện?"))return;
  try{ const r=await fetch(API+"/venues-delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})}); const j=await r.json(); if(j.success){toast("Đã xóa");renderVenues();} else toast("Xóa lỗi"); }catch(e){ toast("Lỗi: "+e.message); }
}
async function uploadVenueImages(id,files){
  if(!files||!files.length)return;
  const fd=new FormData(); fd.append("id",id); [...files].forEach((f,i)=>fd.append("image_"+i,f,f.name));
  toast("Đang tải ảnh…");
  try{ const r=await fetch(API+"/venue-image",{method:"POST",body:fd}); const j=await r.json(); if(j.success){toast("Đã thêm ảnh");(j.venue?venueForm(j.venue):renderVenues());} else toast(j.error||"Tải ảnh lỗi"); }catch(e){ toast("Lỗi: "+e.message); }
}
async function deleteVenueImage(id,idx){
  const path=(VFORM&&VFORM.images&&VFORM.images[idx])||""; if(!path)return;
  try{ const r=await fetch(API+"/venue-image-delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,path})}); const j=await r.json(); if(j.success)(j.venue?venueForm(j.venue):renderVenues()); }catch(e){ toast("Lỗi: "+e.message); }
}
async function scrapeVenueImages(id){
  if(!confirm("Lấy ảnh từ Google Maps cho quán này? (dùng APIFY, tốn ít credit)"))return;
  toast("Đang lấy ảnh từ Google Maps…");

async function uploadAlbumImages(files){

async function deleteAlbumImage(id){

}

// ---------- shared clip meta ----------
function loadClipMeta(file){return new Promise(res=>{const url=URL.createObjectURL(file),v=document.createElement("video");v.preload="metadata";v.muted=true;v.src=url;let done=false;const fin=(d,t)=>{if(done)return;done=true;URL.revokeObjectURL(url);res({dur:d,thumb:t});};v.onloadedmetadata=()=>{try{v.currentTime=Math.min(.15,(v.duration||1)/2);}catch{fin(v.duration||0,"");}};v.onseeked=()=>{let t="";try{const c=document.createElement("canvas");const ar=(v.videoWidth&&v.videoHeight)?v.videoWidth/v.videoHeight:9/16;c.width=120;c.height=Math.round(120/(ar||9/16));c.getContext("2d").drawImage(v,0,0,c.width,c.height);t=c.toDataURL("image/jpeg",.6);}catch{}fin(v.duration||0,t);};v.onerror=()=>fin(0,"");setTimeout(()=>fin(v.duration||0,""),4000);});}

  try{
    const r=await fetch(API+`/listreview-prefill?employee=${SESSION.username}&regen=1`,{cache:"no-store"});

    currentScenes=j.scenes.map(s=>({...s,caption:(s.caption!=null?s.caption:(s.vo||"")),files:[]})); scenePage=0;

function addSpot(){
  const n=currentScenes.filter(s=>s.kind==="spot").length+1;
  const oi=currentScenes.findIndex(s=>s.kind==="outro");
  currentScenes.splice(oi<0?currentScenes.length:oi,0,lrSpot(n));
  const pages=Math.ceil(currentScenes.length/PAGE); scenePage=pages-1;
  renderSceneInputs(); renderPreview();
}
function moveSpot(i,dir){
  const j=i+dir;
  if(j<0||j>=currentScenes.length)return;
  if(currentScenes[i].kind!=="spot"||currentScenes[j].kind!=="spot")return;
  const t=currentScenes[i]; currentScenes[i]=currentScenes[j]; currentScenes[j]=t;  // clip (scene.files) đi theo
  let n=0; currentScenes.forEach(s=>{if(s.kind==="spot"){n++;s.scene_id="spot"+n;s.label="QUÁN "+n;}});
  scenePage=Math.floor(j/PAGE);
  renderSceneInputs(); renderPreview();
}
function removeSpot(i){
  if(currentScenes[i].kind!=="spot")return;
  currentScenes.splice(i,1);
  let n=0; currentScenes.forEach(s=>{if(s.kind==="spot"){n++;s.scene_id="spot"+n;s.label="QUÁN "+n;}});
  const pages=Math.ceil(currentScenes.length/PAGE); if(scenePage>=pages)scenePage=pages-1;
  renderSceneInputs(); renderPreview();
}

async function loadNewsPool(){
  const box=document.getElementById("newsPool"); if(!box)return;
  try{
    const j=await (await fetch(API+"/news-pool",{cache:"no-store"})).json();

    spots:spots.map(s=>({scene_id:s.scene_id,name:(s.name||"").trim(),rating:(s.rating||"").trim(),address:(s.address||"").trim(),
      section_title:(s.section_title||"").trim(),emoji:(s.emoji||"").trim(),align:s.align||"left",no_pill:!!s.no_pill,body:s.body||null,vo:(s.caption||"").trim()})),
    outro:{scene_id:"outro",section_title:(outro&&outro.section_title||"").trim(),emoji:(outro&&outro.emoji||"").trim(),body:(outro&&outro.body)||null,vo:(outro?(outro.caption||""):"").trim()}
  };
  const _vid=(document.getElementById("voicePick")||{}).value||"";
  const job={id:"lr_"+Date.now().toString(36),mode:"listreview",topic:((intro.title||"")||"List review").slice(0,50),
    spec,hookStyle:curHookStyle(),voiceMode:_vid?"vbee":(SESSION.voice||"gtts"),voiceId:_vid,
    scenes:currentScenes.filter(s=>s.files.length).map(s=>({scene_id:s.scene_id,files:s.files.map(c=>c.file)})),
    status:"pending",progress:0,videoUrl:"",error:""};
  hookOverlayUrl="";
  jobs.unshift(job); renderAll();
  const cr=document.getElementById("created"); cr.classList.remove("hidden");
  setTimeout(()=>{ cr.classList.add("hidden"); resetEditor(); }, 2000);
}

async function renderAll(){
  if(rendering)return; rendering=true;
  let job;
  while((job=jobs.find(j=>j.status==="pending"))){
    job.status="rendering"; job.progress=15; renderLibrary();
    try{
      if(job.mode==="listreview"){
        const fd=new FormData();
        fd.append("job_id",job.id); fd.append("user",SESSION.username); fd.append("creator_id",SESSION.username);
        fd.append("hook_style",job.hookStyle); fd.append("voice_mode",job.voiceMode||SESSION.voice||"gtts"); fd.append("voice_id",job.voiceId||"");
        fd.append("spec",JSON.stringify(job.spec));
        job.scenes.forEach(s=>s.files.forEach((f,k)=>fd.append(s.scene_id+"__"+k,f,f.name)));
        job.progress=55; renderLibrary();
        const r=await fetch(API+"/assemble-listreview",{method:"POST",body:fd}); const t=await r.text();
        let res; try{res=JSON.parse(t);}catch{throw new Error("Phản hồi lạ");}
        if(!res.success) throw new Error(res.error||"render fail");
        job.status="done"; job.progress=100; job.videoUrl=res.video_url||"";
        renderLibrary(); continue;
      }
      const fd=new FormData();
      fd.append("job_id",job.id); fd.append("video_type","personal"); fd.append("creator_id",SESSION.username);
      fd.append("user",SESSION.username); fd.append("topic",job.topic);
      fd.append("voice_mode",job.voiceMode||SESSION.voice||"gtts"); fd.append("voice_id",job.voiceId||"");
      fd.append("hook_style",job.hookStyle); fd.append("hook_title",job.hookTitle); fd.append("hook_subtitle",job.hookSub);
      fd.append("hook_text",job.hookTitle); fd.append("transition","fade"); fd.append("template_ratio","9:16");
      fd.append("script",JSON.stringify(job.script));
      fd.append("scenes_meta",JSON.stringify(job.scenes.map(s=>({scene_id:s.scene_id,description:s.description,min_duration_sec:s.min_duration_sec,type:s.type}))));
      job.scenes.forEach(s=>s.files.forEach((f,k)=>fd.append(s.scene_id+"__"+k,f,f.name)));
      job.progress=55; renderLibrary();
      const r=await fetch(API+"/assemble",{method:"POST",body:fd}); const t=await r.text();
      let res; try{res=JSON.parse(t);}catch{throw new Error("Phản hồi lạ");}
      if(!res.success) throw new Error(res.error||"render fail");
      job.status="done"; job.progress=100; job.videoUrl=res.video_url||"";
    }catch(e){job.status="error";job.error=e.message;}
    renderLibrary();
  }
  rendering=false;
}

function renderLibrary(){
  const grid=document.getElementById("libGrid"); if(!grid)return; const cards=[];

  const fbox=document.getElementById("libFilter");
  if(fbox){

async function adminReviewLoad(){

async function deleteAlbum(dir){
  if(!confirm("Xoá album này (cả ảnh)?"))return;
  try{ const r=await fetch(API+"/album-delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dir})}); const j=await r.json(); if(!j.success)throw new Error(j.error||"lỗi"); toast("Đã xoá"); renderImageGen(); }catch(e){ toast("Lỗi: "+e.message); }
}
function openImg(url){document.getElementById("imgviewImg").src=API+url;document.getElementById("imgview").classList.remove("hidden");}
function closeImg(){document.getElementById("imgview").classList.add("hidden");document.getElementById("imgviewImg").removeAttribute("src");}

// ---------- Prompt viết kịch bản (nv1-5 + tin tức) ----------
let PP_DEFAULT = "";
async function renderPromptEditor(){
  resetEditor && resetEditor();
  const emp=SESSION.username;
  document.getElementById("appbody").innerHTML=`
    <div class="card" style="max-width:760px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div><h2 class="sec" style="margin:0">📝 Prompt viết kịch bản</h2>
          <div class="muted">Chỉnh giọng/phong cách AI viết kịch bản cho tài khoản này. Áp dụng từ lần "Tạo nội dung" kế tiếp.</div></div>
        <button class="btn-ghost" onclick="renderHome()">← Trang chủ</button>
      </div>
      <label>Prompt (giọng / phong cách)</label>
      <textarea id="pp-prompt" rows="6" placeholder="Đang tải…"></textarea>
      <div class="muted" id="pp-def" style="margin-top:4px"></div>
      <label>Ví dụ tham khảo (tùy chọn — AI học giọng, không chép)</label>
      <textarea id="pp-ex" rows="6" placeholder="Dán 1 vài kịch bản mẫu để AI bắt chước giọng…"></textarea>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn" style="flex:1" onclick="savePrompt()">💾 Lưu prompt</button>
        <button class="btn-ghost" onclick="resetPromptDefault()">↺ Dùng mặc định</button>
      </div>
      <div class="muted" id="pp-status" style="margin-top:10px"></div>
    </div>`;
  try{
    const r=await fetch(API+`/script-prompt?employee=${emp}`,{cache:"no-store"});
    const j=await r.json(); if(!j.success) throw new Error(j.error||"lỗi");
    PP_DEFAULT=j.default_prompt||"";
    document.getElementById("pp-prompt").value=j.prompt||j.default_prompt||"";
    document.getElementById("pp-ex").value=j.examples||"";
    document.getElementById("pp-def").textContent=j.prompt?"Đang dùng prompt tùy chỉnh.":"Đang dùng prompt mặc định.";
  }catch(e){ const t=document.getElementById("pp-prompt"); if(t)t.placeholder="Lỗi tải: "+e.message; }
}
function resetPromptDefault(){ const t=document.getElementById("pp-prompt"); if(t&&PP_DEFAULT)t.value=PP_DEFAULT; }
async function savePrompt(){
  const emp=SESSION.username;
  const prompt=document.getElementById("pp-prompt").value.trim();
  const examples=document.getElementById("pp-ex").value.trim();
  const st=document.getElementById("pp-status"); st.textContent="⏳ Đang lưu…";
  try{
    const r=await fetch(API+"/script-prompt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({employee:emp,prompt,examples})});
    const j=await r.json(); if(!j.success) throw new Error(j.error||"lỗi");
    st.textContent="✓ Đã lưu. Lần Tạo nội dung tới sẽ dùng prompt này."; toast("Đã lưu prompt");
  }catch(e){ st.textContent="⚠ "+e.message; toast("Lỗi lưu: "+e.message); }
}

// boot — phiên per-tab (sessionStorage); nếu chưa có thì auto-login theo hash (#nv1, #tintuc...)
(function(){
  const s=sessionStorage.getItem("dalat_session");
  if(s){try{SESSION=JSON.parse(s);startApp();return;}catch{}}
  autoLoginFromHash();
})();
</script>
